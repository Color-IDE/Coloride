name: "📋 Project Board Sync & PR Governance"

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  sync-to-project:
    name: "Add Issue/PR to Coloride Project Board"
    runs-on: ubuntu-latest
    if: env.PROJECT_AUTOMATION_TOKEN != ''
    env:
      PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Color-IDE/projects/1
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}

  validate-pr-title:
    name: "Enforce Conventional Commits on PR Title"
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            sec
            arch
            chore
            docs
            test
          scopes: |
            host-core
            context-engine
            judge-orchestrator
            sandbox-runner
            editor-cm6
            cockpit-ui
            desktop-tauri
            deps
