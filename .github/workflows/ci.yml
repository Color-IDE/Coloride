name: Coloride CI (3-OS Matrix)

on:
  push:
    branches: ["main", "feat/**", "fix/**", "perf/**", "sec/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Biome Lint, Typecheck & Tests (TS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter & formatter check
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run frontend & package tests
        run: pnpm test

      - name: Build packages & web-ui
        run: pnpm build

  interaction-performance:
    name: LOT-005 isolated interaction budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Measure without parallel test files or build processes
        run: pnpm test:performance
      - name: Retain samples and failures for regression review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-performance-${{ github.run_id }}
          path: artifacts/performance/
          retention-days: 30
          if-no-files-found: warn

  rust-matrix:
    name: Rust Host & Sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2 / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --fix-missing \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (0 warnings enforced)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo workspace tests
        run: cargo test --workspace

      - name: Verify protocol-types bindings are up-to-date (Zero Drift)
        run: |
          cargo test --package host-core export_bindings
          git diff --exit-code packages/protocol-types
