[package]
name = "context-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coloride Context Engine: SQLite WAL/mmap, FTS5 BM25, Tree-sitter AST graph, secret filtering & local MCP server (<20ms)"

[lints]
workspace = true

[dependencies]
bincode.workspace = true
host-core.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
tokio.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[features]
default = []
vector = ["dep:fastembed", "dep:hf-hub", "dep:rusqlite", "dep:toolu-orm-sqlite-vec-register"]

[dependencies.fastembed]
version = "=4.9.1"
optional = true
default-features = false
features = ["ort-load-dynamic", "hf-hub-rustls-tls"]

[dependencies.rusqlite]
version = "0.40"
optional = true
features = ["bundled"]

[dependencies.toolu-orm-sqlite-vec-register]
version = "=0.12.0"
optional = true

[dependencies.hf-hub]
version = "0.4"
optional = true
default-features = false
features = ["ureq", "rustls-tls"]
