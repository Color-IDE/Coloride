[package]
name = "host-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coloride Native Rust Host Core: ropey buffers, WAL journal, Git checkpoints, LSP/Biome/DAP, 1-click migration & VS Code Extension Host supervisor"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
ropey.workspace = true
tokio.workspace = true

# Terminal service (LOT-010). Reviewed: see DEPENDENCIES.md.
portable-pty = "=0.9.0"

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling (no `unsafe` in this crate). Already in the dependency tree.
rustix = { version = "=1.1.6", features = ["process"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
