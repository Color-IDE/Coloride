# Every process launched by host-core must go through `WorkspaceTrustGate::command`
# (`src/trust.rs`), so that an untrusted workspace can never start one (AGENTS.md rule 6).
# The only other sanctioned call is the orphan watchdog in `src/process.rs`, reachable only
# from `GatedCommand::spawn`.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "launch processes through WorkspaceTrustGate::command" },
    { path = "tokio::process::Command::new", reason = "launch processes through WorkspaceTrustGate::command" },
]
